name: Daily DB Backup

on:
  schedule:
    # 03:00 UTC täglich — außerhalb üblicher Nutzungszeiten.
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Erwartet folgende Repository-Secrets (Settings → Secrets and
      # variables → Actions), siehe README.md#deployment:
      #   DATABASE_URL       — produktive DB (dieselbe wie im Netlify-
      #                        Dashboard hinterlegt, hier separat als
      #                        GitHub-Secret nötig)
      #   R2_ACCOUNT_ID       — Cloudflare-Account-ID
      #   R2_ACCESS_KEY_ID    — R2-API-Token Access Key ID
      #   R2_SECRET_ACCESS_KEY — R2-API-Token Secret Access Key
      #   R2_BUCKET_NAME      — Ziel-Bucket für die Backup-Dateien
      - run: npm run db:backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      # Löscht Backups älter als 30 Tage (siehe scripts/cleanup-db-backups.ts)
      # — läuft nach dem Upload oben, im selben täglichen Job statt als
      # eigener Cronjob, da beide Schritte dieselben R2-Secrets brauchen.
      - run: npm run db:backup:cleanup
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      # Entfernt weich gelöschte Inhalte (deleted_at älter als 7 Tage,
      # siehe scripts/purge-soft-deleted.ts) endgültig — läuft bewusst NACH
      # dem Backup-Upload oben, damit ein zu purgender Inhalt notfalls noch
      # aus dem frischen Backup wiederhergestellt werden könnte. Braucht
      # zusätzlich zu DATABASE_URL auch die R2-Secrets: räumt seit der
      # Bild-Upload-Funktion auch die zugehörigen content_images-Objekte im
      # selben Bucket mit auf (purgeContentImagesFor in contentImages.ts).
      - run: npm run db:purge-deleted
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

name: Admin Log Digest

on:
  schedule:
    # Einmal täglich um 05:00 UTC. Kein Uhrzeit-/Zeitzonen-Gate im Skript mehr
    # (siehe scripts/send-admin-log-digest.ts) — jeder Lauf versendet.
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Erwartet folgende Repository-Secrets (Settings → Secrets and
      # variables → Actions), siehe README.md#deployment:
      #   DATABASE_URL       — produktive DB
      #   RESEND_API_KEY     — Resend-API-Key für den Mailversand
      #   RESEND_FROM_EMAIL  — Absenderadresse (optional, sonst Resend-Default)
      # Der geplante Lauf (05:00 UTC) und die manuelle Auslösung
      # (workflow_dispatch) verhalten sich identisch — beide versenden sofort.
      - run: npm run admin:log-digest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}

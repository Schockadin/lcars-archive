name: Weekly Vault Backup

# Löst wöchentlich POST /api/vault-export aus (src/app/api/vault-export/route.ts)
# — generiert die Markdown-Dateien aus dem aktuellen DB-Stand neu und
# committet sie ins Vault-Repo. Gleicher Endpoint wie der "Backup starten"-
# Button im Admin-Panel, hier aber secret- statt session-authentifiziert.
#
# Erfordert das Repository-Secret VAULT_EXPORT_SECRET (identisch mit dem in
# Netlify hinterlegten Wert): Settings → Secrets and variables → Actions →
# New repository secret.
on:
  schedule:
    # Jeden Montag um 03:00 UTC.
    - cron: "0 3 * * 1"
  # Manuell auslösbar über den "Run workflow"-Button im Actions-Tab.
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # --fail-with-body statt --fail: Netlify/Cloudflare-Fehlerseiten (z.B.
      # ein WAF-Block vor der eigentlichen Route) liefern sonst nur den
      # HTTP-Status ohne Body in den Job-Logs — der Response-Text hilft beim
      # Eingrenzen, ob der 403 überhaupt von /api/vault-export selbst kommt
      # (die Route liefert nur 401/500, nie 403, siehe route.ts) oder davor
      # abgefangen wird. User-Agent/Accept wie ein regulärer Client, falls
      # ein Bot-Schutz fehlende Browser-Header als Kriterium nutzt.
      - name: Vault-Backup auslösen
        run: |
          curl --fail-with-body --show-error --silent --location \
            --request POST \
            --url "https://neo-archiv.de/api/vault-export" \
            --header "Authorization: Bearer ${{ secrets.VAULT_EXPORT_SECRET }}" \
            --header "Accept: application/json" \
            --header "User-Agent: neo-archiv-weekly-vault-backup/1.0 (+https://github.com/Schockadin/lcars-archive)"
